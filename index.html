<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexEngine — moteurs de voitures</title>
  <meta name="description" content="Encyclopédie et comparateur de moteurs (TypeScript + Vite)." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- nav -->
    <header id="app-navbar"></header>

    <!-- hero -->
    <section class="hero-banner">
      <div class="hero-title-group">
        <h2>Catalogue de moteurs</h2>
        <p>Filtre, compare, et écoute un aperçu sonore via le compte-tours.</p>
      </div>
    </section>

    <!-- stats -->
    <section id="stats-overview-container"></section>

    <!-- filtres -->
    <section id="filter-bar-container"></section>

    <!-- grille -->
    <main id="engine-grid-container"></main>

    <!-- tiroir compare -->
    <aside id="compare-drawer"></aside>

    <!-- modale compare -->
    <div id="compare-modal" class="modal-backdrop"></div>

    <!-- form ajout / édition -->
    <div id="engine-form-modal" class="modal-backdrop"></div>

    <!-- détail + tacho -->
    <div id="engine-detail-modal" class="modal-backdrop"></div>

    <!-- footer -->
    <footer class="app-footer">
      <div>
        <strong>ApexEngine</strong> — projet web AP4 (TS vanilla)
      </div>
      <div>
        state via <code>Proxy</code> · son via <code>Web Audio API</code>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
